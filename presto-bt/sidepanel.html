<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Presto BT Deck Side Panel</title>
  <style>
    :root {
      --bg: #0F131A;
      --card: #1A212E;
      --border: #2C384A;
      --accent: #00D2A0;
      --btn-blue: #0CA0CD;
      --text: #F4F7FC;
      --muted: #8E9DB2;
      --danger: #FF5C5C;
      --warning: #FFA834;
      --code: #111620;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      width: 28px;
      height: 28px;
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--accent);
      font-size: 14px;
    }

    h1 { font-size: 15px; font-weight: 700; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 92, 92, 0.15);
      border: 1px solid rgba(255, 92, 92, 0.3);
      color: var(--danger);
    }

    .status-pill.connected {
      background: rgba(0, 210, 160, 0.15);
      border-color: rgba(0, 210, 160, 0.3);
      color: var(--accent);
    }

    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title { font-size: 13px; font-weight: 600; color: var(--text); display: flex; justify-content: space-between; align-items: center; }

    .btn-row { display: flex; gap: 8px; }

    button {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--accent); color: #0A1016; }
    .btn-danger { background: rgba(255, 92, 92, 0.15); border: 1px solid rgba(255, 92, 92, 0.3); color: var(--danger); }

    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }

    .toggle-row label { cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--text); }

    input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }

    .quick-decks { display: flex; gap: 6px; }
    .quick-btn {
      padding: 5px 8px;
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
    }
    .quick-btn:hover { border-color: var(--accent); color: var(--text); }

    .event-log {
      flex: 1;
      min-height: 200px;
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .event-entry { display: flex; gap: 6px; line-height: 1.3; }
    .event-time { color: var(--muted); }
    .event-tag { font-weight: 700; padding: 0 4px; border-radius: 3px; font-size: 10px; }
    .tag-tap { background: rgba(0, 210, 160, 0.2); color: var(--accent); }
    .tag-ack { background: rgba(255, 168, 52, 0.2); color: var(--warning); }
    .tag-sys { background: rgba(12, 160, 205, 0.2); color: var(--btn-blue); }
    .event-msg { color: var(--text); word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="badge">P</div>
      <div>
        <h1>Presto Deck Side Panel</h1>
      </div>
    </div>
    <div id="status-pill" class="status-pill">
      <span class="status-dot"></span>
      <span id="status-text">Disconnected</span>
    </div>
  </header>

  <div class="card">
    <div class="btn-row">
      <button id="btn-connect" class="btn-primary">Connect Presto</button>
      <button id="btn-disconnect" class="btn-danger" disabled>Disconnect</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Two-Way Tab Automations</div>
    <div class="toggle-row">
      <label>
        <input type="checkbox" id="chk-auto-switch" checked />
        Auto-switch to Gmail Deck on Gmail tab
      </label>
    </div>
    <div class="toggle-row">
      <label>
        <input type="checkbox" id="chk-monitor-unread" checked />
        Sync Gmail Unread count to "Gmail" button
      </label>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Presto Workspace Switcher</div>
    <div class="quick-decks">
      <button class="quick-btn" id="btn-deck-workspace">Workspace</button>
      <button class="quick-btn" id="btn-deck-gmail">Gmail</button>
      <button class="quick-btn" id="btn-deck-dev">Dev Deck</button>
    </div>
  </div>

  <div class="card" style="flex: 1; display: flex; flex-direction: column;">
    <div class="card-title">
      <span>Deck Live Stream</span>
      <span style="font-size:10px; color:var(--muted); cursor:pointer;" id="btn-clear-log">Clear</span>
    </div>
    <div id="event-log" class="event-log">
      <div class="event-entry">
        <span class="event-time">--:--:--</span>
        <span class="event-tag tag-sys">SYS</span>
        <span class="event-msg">Click "Connect Presto" to start bridge.</span>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
